<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Средневековая браузерная стратегия для друзей. Чума, предательства, стоны.">
<title>Чума на все ваши дома</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17110d; --bg2:#231a13; --wood:#3b2a1c; --wood2:#5c3a1a; --wood3:#8a5a2b;
  --parch:#efe2bf; --parch2:#d8c596; --ink:#1a1410; --red:#a3271c; --red2:#d0412f; --gold:#f1c40f; --gold2:#b8860b;
  --green:#3f7d2c; --green2:#62a544; --muted:#a8977a; --blood:#7d1f16;
  --font:'Pixelify Sans','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--parch);font-family:var(--font);font-size:13px;
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
img.spr,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
img.spr{vertical-align:middle;pointer-events:none}
b{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:11px}
.hidden{display:none!important}

/* ---------- кнопки ---------- */
.btn{font-family:var(--font);font-size:14px;color:var(--parch);background:var(--red);border:0;padding:8px 14px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.18),0 0 0 2px var(--ink);margin:3px;
  text-shadow:1px 1px 0 rgba(0,0,0,.5);line-height:1.15}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35),0 0 0 2px var(--ink)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.btn.gold{background:var(--gold2);color:#fff6d0}
.btn.green{background:var(--green)}
.btn.wood{background:var(--wood2)}
.btn.ghost{background:#2b2119}
.btn.small{font-size:12px;padding:4px 8px}
.btn.tiny{font-size:11px;padding:2px 6px;margin:1px}
.btn.big{font-size:18px;padding:12px 22px}
.btn.on{background:var(--green2);color:var(--ink);text-shadow:none}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.col{display:flex;flex-direction:column}
.sp{flex:1}

/* ---------- рамки ---------- */
.frame{background:var(--bg2);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--wood2),inset 0 0 0 4px var(--wood);padding:10px}
.parch{background:var(--parch);color:var(--ink);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--parch2);padding:10px}
.parch .muted{color:#6d5c41}
h1,h2,h3{margin:0 0 6px;font-weight:700;letter-spacing:.5px}
h2{font-size:18px} h3{font-size:15px}
input[type=text],textarea{font-family:var(--font);font-size:15px;background:#fff8e3;color:var(--ink);border:0;padding:7px 9px;
  box-shadow:0 0 0 2px var(--ink),inset 2px 2px 0 rgba(0,0,0,.15);width:100%}
textarea{resize:none;height:60px}

/* ---------- титул ---------- */
#title{height:100%;display:flex;align-items:center;justify-content:center;gap:24px;padding:12px;
  background:radial-gradient(ellipse at 50% 30%,#3a2416 0%,#17110d 70%)}
.logo{font-size:clamp(24px,5.2vw,48px);line-height:1;color:var(--red2);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 #ffb19c;letter-spacing:1px;text-align:center}
.logo small{display:block;font-size:.38em;color:var(--parch2);text-shadow:2px 2px 0 var(--ink);margin-top:8px;letter-spacing:0}
.title-heroes{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.title-heroes .ph{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--parch2)}
.title-menu{display:flex;flex-direction:column;min-width:240px;max-width:300px}
.title-menu .btn{width:100%}
.nickrow{margin-bottom:8px}
.titlefoot{margin-top:6px;display:flex;gap:4px;justify-content:center}
img.portrait{box-shadow:0 0 0 2px var(--ink);background:#3a2a1c}

/* ---------- лобби ---------- */
#lobby{height:100%;display:flex;gap:10px;padding:10px;overflow:hidden}
#lobby .left{width:42%;min-width:270px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#lobby .right{flex:1;overflow:auto}
.code{font-size:30px;letter-spacing:6px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.plist .pl{display:flex;align-items:center;gap:6px;padding:4px;border-bottom:1px dashed var(--wood2)}
.plist .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;background:#e74c3c;box-shadow:0 0 0 1px var(--ink)}
.dot.on{background:#2ecc71}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.hcard{background:var(--bg2);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--wood);padding:8px;cursor:pointer;display:flex;gap:8px;align-items:center;position:relative}
.hcard.mine{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 3px var(--gold)}
.hcard.taken{opacity:.55}
.hcard .hn{font-size:14px;font-weight:700}
.hcard .ht{font-size:10px;color:var(--muted)}
.hcard .tk{position:absolute;right:4px;top:3px;font-size:10px;color:var(--gold)}
.sw{display:inline-block;width:12px;height:12px;box-shadow:0 0 0 2px var(--ink);vertical-align:middle}
.emblem{display:inline-flex;align-items:center;justify-content:center;width:24px;height:26px;box-shadow:0 0 0 2px var(--ink);
  clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);vertical-align:middle}
select{font-family:var(--font);font-size:13px;background:#fff8e3;border:0;padding:4px;box-shadow:0 0 0 2px var(--ink)}

/* ---------- игра ---------- */
#game{height:100%;display:flex;flex-direction:column}
#topbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 6px;background:var(--wood);box-shadow:0 2px 0 var(--ink);z-index:2;white-space:nowrap;overflow:hidden}
#topbar .tb{display:flex;align-items:center;gap:3px;font-size:14px}
#topbar .btn{margin:0 1px;padding:4px 8px;font-size:12px}
#tb-timer{min-width:46px;color:var(--gold);font-size:16px!important}
#tb-timer.hot{color:#ff5b4a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#1e3d5e;overflow:hidden;min-width:0}
#map{display:block;cursor:pointer;touch-action:manipulation}
#maphint{position:absolute;left:6px;bottom:6px;right:6px;pointer-events:none;text-align:center;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#phasebadge{position:absolute;left:6px;top:6px;pointer-events:none;font-size:12px;background:rgba(0,0,0,.55);padding:3px 6px}
#panel{width:min(36vw,270px);min-width:200px;display:flex;flex-direction:column;background:var(--bg2);box-shadow:-2px 0 0 var(--ink),inset 2px 0 0 var(--wood2)}
#panel-body{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
#panel-foot{padding:6px;box-shadow:0 -2px 0 var(--ink)}
#panel-foot .btn{width:100%;margin:0;font-size:16px;padding:10px}
.pt{font-size:15px;font-weight:700;margin-bottom:2px}
.sub{font-size:11px;color:var(--muted);margin-bottom:6px}
.sec{margin:8px 0 4px;font-size:12px;color:var(--gold);border-bottom:1px solid var(--wood2);padding-bottom:2px}
.army{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.u{display:inline-flex;align-items:center;gap:1px;background:#00000040;padding:1px 3px 1px 1px;font-size:12px}
.owner{display:inline-flex;align-items:center;gap:4px}
.move{background:#0003;padding:4px;margin:4px 0;box-shadow:inset 0 0 0 1px var(--wood2)}
.move.focus{box-shadow:inset 0 0 0 2px var(--gold)}
.mvh{display:flex;align-items:center;gap:4px;font-size:12px}
.step{display:inline-flex;align-items:center;gap:1px;margin:2px 4px 2px 0}
.step b{min-width:18px;text-align:center}
.rec{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ru{font-family:var(--font);background:#3b2a1c;color:var(--parch);border:0;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px var(--wood3);
  padding:3px 0;display:flex;flex-direction:column;align-items:center;font-size:11px;position:relative;cursor:pointer}
.ru:disabled{opacity:.4}
.ru .q{position:absolute;right:1px;top:0;color:var(--gold);font-weight:700}
.queue{font-size:12px;margin-top:4px}
.queue .qi{display:flex;align-items:center;gap:4px}
.hero-mini{display:flex;gap:8px;align-items:center}
.abil{width:100%;text-align:left}
.quest{font-size:11px;margin:2px 0}
.quest.done{color:var(--green2);text-decoration:line-through}
.hint{font-size:11px;color:var(--muted);margin:6px 0;font-style:italic}
.tag{display:inline-block;font-size:10px;padding:1px 4px;background:var(--wood2);margin-left:3px}
.tag.ally{background:var(--green)} .tag.judas{background:var(--blood)} .tag.dead{background:#444}

/* ---------- модалки ---------- */
#modal-root .ov{position:fixed;inset:0;background:rgba(10,6,4,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:8px}
.modal{max-width:min(760px,96vw);max-height:94vh;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.modal .x{position:absolute;right:6px;top:6px;z-index:3}
.modal.wide{width:min(900px,97vw)}
.drawer{position:fixed;right:0;top:34px;bottom:0;width:min(58vw,520px);z-index:40;overflow:auto;-webkit-overflow-scrolling:touch}
.ev{background:#3b1d12;box-shadow:inset 0 0 0 2px var(--red);padding:8px;margin:6px 0}
.ev h3{color:#ffb19c}
.lines div{margin:3px 0;font-size:12px;line-height:1.3}
.bt{font-size:12px;margin:3px 0;padding:3px 5px;background:#0003}
.bt.mine{box-shadow:inset 3px 0 0 var(--gold)}
.dp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--wood2)}
.chat{height:130px;overflow:auto;background:#0004;padding:4px;font-size:12px;margin:6px 0}
.chat .sys{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:2px}
.chips .btn{font-size:11px;padding:3px 6px;margin:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.opt{background:#fff8e3;color:var(--ink);box-shadow:0 0 0 2px var(--ink);padding:6px;cursor:pointer;font-size:12px}
.opt.sel{background:#ffe48a;box-shadow:0 0 0 3px var(--red)}
.opt b{font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches span{width:26px;height:26px;cursor:pointer;box-shadow:0 0 0 2px var(--ink)}
.swatches span.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.embl span{cursor:pointer;padding:2px}
.embl span.sel{outline:3px solid var(--red)}
.utable{width:100%;border-collapse:collapse;font-size:12px}
.utable td{padding:3px;border-bottom:1px dashed #b8a477;vertical-align:middle}
.standings td{padding:4px 6px;border-bottom:1px dashed var(--wood2);font-size:12px}
.winbig{font-size:30px;color:var(--gold);text-shadow:3px 3px 0 var(--ink);text-align:center}
.losebig{font-size:30px;color:var(--red2);text-shadow:3px 3px 0 var(--ink);text-align:center}

/* ---------- тосты ---------- */
#toasts{position:fixed;left:50%;top:40px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--parch);color:var(--ink);box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px rgba(0,0,0,.4);padding:6px 10px;font-size:13px;animation:tin .2s;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* ---------- поворот ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px}
#rotate .ic{font-size:60px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){
  body:not(.portrait-ok) #rotate{display:flex}
  body.portrait-ok #main{flex-direction:column}
  body.portrait-ok #panel{width:100%;max-height:45%}
  body.portrait-ok #title{flex-direction:column;overflow:auto}
  body.portrait-ok #lobby{flex-direction:column;overflow:auto}
  body.portrait-ok #lobby .left{width:100%}
  body.portrait-ok .drawer{width:100%}
}
@media (max-height:420px){
  .logo{font-size:30px}
  .title-heroes img.portrait{width:48px;height:48px}
  .btn.big{font-size:16px;padding:9px 16px}
  #title{gap:14px}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="rotate"><div class="ic">📱</div><h2>Поверни телефон боком</h2><div class="small muted">Средневековье не помещается вертикально. Как и рыцарь на коне.</div><button class="btn small ghost" id="rotate-ok">Мне и так норм</button></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script>
// ============================================================
//  ЧУМА НА ВСЕ ВАШИ ДОМА — данные игры
// ============================================================
var CH = (typeof globalThis !== 'undefined' ? globalThis : window).CH || {};
(typeof globalThis !== 'undefined' ? globalThis : window).CH = CH;

CH.VERSION = '1.0';

// ---------- Местность ----------
CH.TERRAIN = {
  plain:     { name: 'Поле',      income: 1, glory: 0, def: 0,    pass: true,  desc: 'Ровно, грязно, удобно умирать.' },
  forest:    { name: 'Лес',       income: 1, glory: 0, def: 0.2,  pass: true,  desc: 'Защитникам −20% урона. Рыцари вязнут в кустах (−20% атаки).' },
  hills:     { name: 'Холмы',     income: 1, glory: 0, def: 0.15, pass: true,  desc: 'Защитникам −15% урона, их стрелкам +25%.' },
  swamp:     { name: 'Болото',    income: 0, glory: 0, def: 0,    pass: true,  desc: 'Все сражаются на 25% хуже. Дохода нет, только комары.' },
  village:   { name: 'Деревня',   income: 2, glory: 0, def: 0,    pass: true,  desc: '+2 золота. Крестьяне платят подати и молятся, чтобы их не заметили.' },
  monastery: { name: 'Монастырь', income: 1, glory: 1, def: 0.1,  pass: true,  desc: '+1 золото, +1 слава за раунд. Монахи молятся за того, кто платит.' },
  city:      { name: 'Город',     income: 3, glory: 1, def: 0,    pass: true,  walls: 1, recruit: 3, desc: '+3 золота, +1 слава. Можно нанимать войска (до 3 за раунд). Стены.' },
  capital:   { name: 'Столица',   income: 5, glory: 2, def: 0,    pass: true,  walls: 2, recruit: 5, desc: '+5 золота, +2 славы. Найм до 5 войск за раунд. Крепкие стены.' },
  mountain:  { name: 'Горы',      income: 0, glory: 0, def: 0,    pass: false, desc: 'Непроходимо. Там живут козлы и отшельники. Часто это одно и то же.' },
  water:     { name: 'Вода',      income: 0, glory: 0, def: 0,    pass: false, desc: 'Непроходимо. Флот ещё не изобрели. Точнее, изобрели, но не вам.' }
};

// ---------- Юниты ----------
// atk — ближний бой, rng — залп до рукопашной, hp — здоровье
// tags: inf (пехота), cav (конница), ranged (стрелки), siege (осадные)
CH.UNITS = {
  militia:  { name: 'Ополчение',   cost: 1, atk: 1, rng: 0, hp: 2,  tags: ['inf'],
              desc: 'Крестьяне с вилами. Расходный материал. Буквально.' },
  spear:    { name: 'Копейщики',   cost: 3, atk: 2, rng: 0, hp: 5,  tags: ['inf'], vs: { cav: 2.5 },
              desc: 'Длинная палка против очень дорогой лошади. ×2.5 урона по коннице.' },
  archer:   { name: 'Лучники',     cost: 3, atk: 1, rng: 3, hp: 3,  tags: ['ranged'], vs: { inf: 1.5 },
              desc: 'Стреляют первыми, убегают тоже первыми. ×1.5 по пехоте.' },
  knight:   { name: 'Рыцари',      cost: 6, atk: 5, rng: 0, hp: 8,  tags: ['cav'], vs: { ranged: 2, siege: 2 },
              desc: 'Благородные господа в железе. Стоят как деревня и пахнут так же. ×2 по стрелкам и осадным.' },
  bombard:  { name: 'Бомбарда',    cost: 7, atk: 0, rng: 6, hp: 3,  tags: ['siege'], explode: 0.1,
              desc: 'Артиллерия! Снимает уровень стен, ×2 по гарнизону за стенами. 10% шанс взорваться вместе с расчётом.' },
  trebuchet:{ name: 'Требушет',    cost: 6, atk: 0, rng: 4, hp: 4,  tags: ['siege'], plague: 0.3,
              desc: 'Кидает камни, дохлых коров и чумные трупы. Снимает уровень стен. 30% шанс заразить цель чумой.' },
  // уникальные
  genoese:  { name: 'Генуэзские арбалетчики', cost: 4, atk: 1, rng: 5, hp: 4, tags: ['ranged'], vs: { cav: 1.5 }, unique: true,
              desc: 'Лучшие наёмники Европы. Стреляют за деньги, бегут бесплатно. ×1.5 по коннице.' },
  horsearch:{ name: 'Конные лучники', cost: 5, atk: 2, rng: 3, hp: 5, tags: ['cav', 'ranged'], vs: { inf: 1.3 }, unique: true,
              desc: 'Стреляют на скаку, разворачиваясь в седле. Ваши рыцари так не умеют и обижаются.' },
  ushkuy:   { name: 'Ушкуйники',   cost: 4, atk: 3, rng: 0, hp: 6, tags: ['inf'], plunder: 1, unique: true,
              desc: 'Речные разбойники. После победы каждый выживший приносит 1 золото. Грабят и своих, но вежливо.' },
  ordknight:{ name: 'Рыцари Ордена', cost: 8, atk: 7, rng: 0, hp: 11, tags: ['cav'], vs: { ranged: 2, siege: 2 }, unique: true,
              desc: 'Обет бедности, целомудрия и послушания. Соблюдают послушание. ×2 по стрелкам и осадным.' }
};
CH.BASE_UNITS = ['militia', 'spear', 'archer', 'knight', 'bombard', 'trebuchet'];
CH.UNIQUE_UNITS = ['genoese', 'horsearch', 'ushkuy', 'ordknight'];
CH.WALL_COST = 8;
CH.MAX_WALLS = 3;

// ---------- Способности ----------
CH.PASSIVES = {
  usury:      { name: 'Ростовщик',     desc: '+20% дохода. Деньги не пахнут. Пахнут те, кто не вернул долг.' },
  horde:      { name: 'Орда',          desc: 'Конница дешевле на 1 и бьёт на 20% сильнее.' },
  motherland: { name: 'Глубокий снег', desc: 'В своих провинциях враг наносит на 25% меньше урона, деревни дают +1 золото. Генерал Мороз тоже на зарплате.' },
  ordnung:    { name: 'Орднунг',       desc: 'Стены за полцены. +1 слава за каждый монастырь каждый раунд.' },
  pious:      { name: 'Святоша',       desc: '+1 слава каждый раунд. Бог всё видит, но смотрит в другую сторону.' },
  butcher:    { name: 'Палач',         desc: '+1 слава за каждую выигранную битву. Публичные казни поднимают рейтинг.' },
  miser:      { name: 'Скупердяй',     desc: 'Найм ополчения даёт двоих по цене одного. Крестьян много, ценность их — соответствующая.' }
};

CH.ACTIVES = {

      if (terr === 'swamp') m *= 0.75;
      if (prov && terr === 'forest' && !sides[si].def && u.tags.indexOf('cav') >= 0) m *= 0.8;
      if (prov && terr === 'hills' && sides[si].def && phase === 'rng') m *= 1.25;
      if (prov && u.tags.indexOf('siege') >= 0 && !sides[si].def && walls > 0 && sides[1 - si].def) m *= 2;
      return m;
    }
    function incoming(si) {
      var s = sides[si]; if (!s.def || !prov) return 1;
      var m = 1 - (T[terr].def || 0);
      var leff = Math.max(0, walls - siegeCount(sides[1 - si]));
      m *= (1 - 0.25 * leff);
      var owner = prov.owner && prov.owner !== 'n' ? P(st, prov.owner) : null;
      if (owner && owner.hero.passive === 'motherland' && pids[si].indexOf(prov.owner) >= 0) m *= 0.75;
      return m;
    }
    var done = false;
    for (var r = 0; r < 6 && !done; r++) {
      ['rng', 'atk'].forEach(function (phase) {
        if (done) return;
        var dmg = [sides[0].stacks.map(function () { return 0; }), sides[1].stacks.map(function () { return 0; })];
        for (var si = 0; si < 2; si++) {
          var en = sides[1 - si], et = sideTotal(en); if (!et) continue;
          sides[si].stacks.forEach(function (x) {
            var val = U[x.type][phase]; if (!val || x.n <= 0) return;
            var D = x.n * val * (0.8 + 0.4 * rng()) * atkMult(x, si, phase);
            en.stacks.forEach(function (y, j) { if (y.n > 0) dmg[1 - si][j] += D * (y.n / et) * vsMult(x.type, y.type); });
          });
        }
        for (var sj = 0; sj < 2; sj++) {
          var inc = incoming(sj);
          sides[sj].stacks.forEach(function (y, j) {
            if (y.n <= 0 || !dmg[sj][j]) return;
            var xk = dmg[sj][j] * inc / U[y.type].hp;
            var k = Math.floor(xk) + (rng() < xk - Math.floor(xk) ? 1 : 0);
            k = Math.min(k, y.n); y.n -= k;
            if (k) lost[sj][y.type] = (lost[sj][y.type] || 0) + k;
          });
        }
        if (!sideTotal(sides[0]) || !sideTotal(sides[1])) done = true;
      });
    }
    var t0 = sideTotal(sides[0]), t1 = sideTotal(sides[1]);
    if (t0 && t1) { // затянулось — слабейшие бегут, их догоняют
      var loser = sidePower(sides[0]) >= sidePower(sides[1]) ? 1 : 0;
      sides[loser].stacks.forEach(function (y) { if (y.n) { lost[loser][y.type] = (lost[loser][y.type] || 0) + y.n; y.n = 0; } });
      lines.push('Битва затянулась. ' + pids[loser].map(function (p) { return E.pname(st, p); }).join(', ') + ' — бежали. Не все добежали.');
    }
    var winner = sideTotal(sides[0]) ? 0 : sideTotal(sides[1]) ? 1 : -1;
    // статистика
    for (var s2 = 0; s2 < 2; s2++) {
      var lostN = E.armyTotal(lost[s2]);
      pids[s2].forEach(function (pid) { var pl = P(st, pid); if (pl) pl.stats.lost += Math.round(lostN / pids[s2].length); });
      pids[1 - s2].forEach(function (pid) { var pl = P(st, pid); if (pl) pl.stats.kills += Math.round(lostN / pids[1 - s2].length); });
    }
    // флейвор
    for (var s3 = 0; s3 < 2; s3++) {
      var L = lost[s3];
      if ((L.militia || 0) >= 3) lines.push(flavor(rng, 'militiaDead', { n: L.militia, p: E.pname(st, pids[s3][0]) }));
      var cavLost = (L.knight || 0) + (L.ordknight || 0);
      var enemySpear = before[1 - s3].spear || 0;
      if (cavLost >= 2 && enemySpear >= 2) lines.push(flavor(rng, 'knightsSpeared', { p: E.pname(st, pids[s3][0]) }));
    }
    if (winner >= 0) {
      var wp = pids[winner], lp = pids[1 - winner];
      var vsPlayers = lp.some(function (p) { return p !== 'n'; });
      var david = powStart[1 - winner] >= powStart[winner] * 2 && powStart[winner] > 0;
      if (david) lines.push(flavor(rng, 'david'));
      wp.forEach(function (pid) {
        var pl = P(st, pid); if (!pl) return;
        pl.stats.won++;
        if (vsPlayers) { pl.glory += david ? 2 : 1; }
        if (pl.hero.passive === 'butcher') pl.glory += 1;
        if (david) pl.stats.david = true;
      });
      // грабёж ушкуйников
      sides[winner].stacks.forEach(function (x) {
        if (x.n > 0 && U[x.type].plunder) { var pl = P(st, x.pid); if (pl) { pl.gold += x.n * U[x.type].plunder; lines.push(pl.hero.name + ': ушкуйники награбили ' + x.n + ' зол.'); } }
      });
      if (vsPlayers && !david && rng() < 0.35) lines.push(flavor(rng, 'bigWin'));
      lp.forEach(function (pid) { if (pid !== 'n') ctx.rep.groans.push({ pid: pid, big: false }); });
    }
    // чума от требушета
    if (prov && nTreb > 0 && !(prov.plague > 0) && winner >= 0) {
      var chance = Math.min(0.7, 1 - Math.pow(1 - U.trebuchet.plague, nTreb));
      if (rng() < chance) {
        prov.plague = 3;
        var tpid = null; sides.forEach(function (s) { if (!s.def) s.stacks.forEach(function (x) { if (x.type === 'trebuchet') tpid = x.pid; }); });
        lines.push(flavor(rng, 'trebPlague', { p: E.pname(st, tpid), prov: E.provName(prov) }));
      }
    }
    return {
      winner: winner, lines: lines,
      sides: [0, 1].map(function (i) { return { pids: pids[i], before: before[i], lost: lost[i], def: !!sides[i].def }; })
    };
  }
  E._battle = battle;

  // ---------- Проверка приказов ----------
  E.emptyOrders = function () { return { moves: [], recruits: [], builds: [], ability: null, betray: false }; };

  // ---------- Исполнение раунда ----------
  E.resolve = function (st, ordersBy) {
    var rng = rngFrom(st.rs);
    var rep = { round: st.round, moves: [], battles: [], captures: [], lines: [], groans: [], quests: [], event: null,
                abilities: [], eliminated: [], plague: [], income: {}, glory: {} };
    var fx = { crusade: {}, betray: {} };
    var ctx = { st: st, rng: rng, fx: fx, rep: rep };
    var alive = st.players.filter(function (p) { return p.alive; });
    var gloryBefore = {}; st.players.forEach(function (p) { gloryBefore[p.pid] = p.glory; });
    st.provs.forEach(function (p) { if (p.burned > 0) p.burned--; });

    // 1. Предательства
    alive.forEach(function (pl) {
      var o = ordersBy[pl.pid]; if (!o || !o.betray) return;
      var group = E.allyGroup(st, pl.pid); if (group.length < 2) return;
      var victims = group.filter(function (x) { return x !== pl.pid; });
      leaveAlliance(st, pl.pid);
      fx.betray[pl.pid] = victims;
      pl.glory += 3; pl.judas = true; pl.stats.betrayals++;
      victims.forEach(function (v) { rep.lines.push('🗡 ' + flavor(rng, 'betray', { a: pl.hero.name, v: E.pname(st, v) })); });
    });

    // 2. Способности
    alive.forEach(function (pl) {
      var o = ordersBy[pl.pid]; if (!o || o.ability == null || pl.cd > 0) return;
      var ab = CH.ACTIVES[pl.hero.active], tgt = o.ability;
      if (ab.target !== 'none' && E.abilityTargets(st, pl.pid).indexOf(tgt) < 0) return;
      var prov = ab.target !== 'none' ? st.provs[tgt] : null, line = null;
      switch (pl.hero.active) {
        case 'poison':
          var killed = 0;
          for (var k in prov.armies) {
            if (E.allied(st, pl.pid, k)) continue;
            var a = prov.armies[k];
            for (var u in a) { var kk = Math.round(a[u] * 0.35); a[u] -= kk; killed += kk; }
            if (!killed) { var big = Object.keys(a).sort(function (x, y) { return a[y] - a[x]; })[0]; if (big) { a[big]--; killed++; } }
          }
          cleanArmies(prov);
          line = flavor(rng, 'poison', { prov: E.provName(prov), n: killed });
          break;
        case 'plaguegift':
          prov.plague = 3; line = flavor(rng, 'plaguegift', { p: pl.hero.name, prov: E.provName(prov) }); break;
        case 'muzhiki':
          var nm = 7 + Math.floor(st.round / 3);
          prov.armies[pl.pid] = prov.armies[pl.pid] || {};
          prov.armies[pl.pid].militia = (prov.armies[pl.pid].militia || 0) + nm;
          line = flavor(rng, 'muzhiki', { n: nm, prov: E.provName(prov) }); break;
        case 'crusade':
          fx.crusade[pl.pid] = true; line = flavor(rng, 'crusade', { p: pl.hero.name }); break;
        case 'bribe':
          if (pl.gold < (ab.cost || 0)) return;
          pl.gold -= ab.cost; delete prov.armies.n; prov.owner = pl.pid;
          line = flavor(rng, 'bribe', { p: pl.hero.name, prov: E.provName(prov) }); break;
        case 'execution':
          pl.glory += 3;
          var rem = 2;
          st.provs.forEach(function (p) { var a = p.armies[pl.pid]; if (rem && a && a.militia) { var d = Math.min(rem, a.militia); a.militia -= d; rem -= d; cleanArmies(p); } });
          line = flavor(rng, 'execution', { p: pl.hero.name }); break;
      }
      pl.cd = ab.cd;
      rep.abilities.push({ pid: pl.pid, ability: pl.hero.active, target: tgt });
      if (line) rep.lines.push('✨ ' + line);
    });

    // 3. Найм и стены — оплата
    var pendingRecruits = [], pendingWalls = [];
    alive.forEach(function (pl) {
      var o = ordersBy[pl.pid]; if (!o) return;
      var used = {};
      (o.recruits || []).forEach(function (rc) {
        var prov = st.provs[rc.p]; if (!prov || prov.owner !== pl.pid) return;
        if (E.recruitTypes(pl).indexOf(rc.u) < 0) return;
        var slots = E.recruitSlots(st, rc.p); used[rc.p] = used[rc.p] || 0;
        var n = Math.max(0, Math.min(Math.floor(rc.n), slots - used[rc.p]));
        var cost = E.unitCost(st, pl, rc.u);
        n = Math.min(n, Math.floor(pl.gold / cost));
        if (n <= 0) return;
        pl.gold -= n * cost; used[rc.p] += n;
        var give = n * (rc.u === 'militia' && pl.hero.passive === 'miser' ? 2 : 1);
        pendingRecruits.push({ pid: pl.pid, p: rc.p, u: rc.u, n: give });
      });
      var builtHere = {};
      (o.builds || []).forEach(function (b) {
        var prov = st.provs[b.p]; if (!prov || prov.owner !== pl.pid || !T[prov.t].recruit) return;
        if (builtHere[b.p] || prov.walls >= CH.MAX_WALLS) return;
        var c = E.wallCost(pl); if (pl.gold < c) return;
        pl.gold -= c; builtHere[b.p] = 1; pendingWalls.push({ pid: pl.pid, p: b.p });
      });
    });

    // 4. Движение
    var moving = []; // {pid, from, to, army}
    alive.forEach(function (pl) {
      var o = ordersBy[pl.pid]; if (!o) return;
      var avail = {};
      st.provs.forEach(function (p) { if (p.armies[pl.pid]) avail[p.id] = Object.assign({}, p.armies[pl.pid]); });
      (o.moves || []).forEach(function (mv) {
        if (!avail[mv.from] || st.adj[mv.from].indexOf(mv.to) < 0 || !E.passable(st, mv.to)) return;
        var take = {}, any = false;
        for (var u in mv.u) {
          var n = Math.max(0, Math.min(Math.floor(mv.u[u]), avail[mv.from][u] || 0));
          if (n > 0) { take[u] = n; avail[mv.from][u] -= n; any = true; }
        }
        if (!any) return;
        var src = st.provs[mv.from].armies[pl.pid];
        for (var u2 in take) src[u2] -= take[u2];
        cleanArmies(st.provs[mv.from]);
        moving.push({ pid: pl.pid, from: mv.from, to: mv.to, army: take });
        rep.moves.push({ pid: pl.pid, from: mv.from, to: mv.to, n: E.armyTotal(take) });
      });
    });

    // 4a. Встречные бои в поле
    var pairDone = {};
    moving.forEach(function (m1) {
      var key = Math.min(m1.from, m1.to) + '-' + Math.max(m1.from, m1.to);
      if (pairDone[key]) return; pairDone[key] = 1;
      var ab = moving.filter(function (m) { return m.from === m1.from && m.to === m1.to; });
      var ba = moving.filter(function (m) { return m.from === m1.to && m.to === m1.from; });
      if (!ab.length || !ba.length) return;
      function groups(list) {
        var gs = [];
        list.forEach(function (m) {
          var g = gs.filter(function (g) { return E.allied(st, g[0].pid, m.pid); })[0];
          if (g) g.push(m); else gs.push([m]);
        });
        return gs;
      }
      groups(ab).forEach(function (ga) {
        groups(ba).forEach(function (gb) {
          if (E.allied(st, ga[0].pid, gb[0].pid)) return;
          var sa = { stacks: [], def: false }, sb = { stacks: [], def: false };
          ga.forEach(function (m) { for (var u in m.army) if (m.army[u] > 0) sa.stacks.push({ pid: m.pid, type: u, n: m.army[u], ref: m }); });
          gb.forEach(function (m) { for (var u in m.army) if (m.army[u] > 0) sb.stacks.push({ pid: m.pid, type: u, n: m.army[u], ref: m }); });
          if (!sa.stacks.length || !sb.stacks.length) return;
          ctx.prov = null;
          var res = battle(ctx, [sa, sb]);
          [sa, sb].forEach(function (s) { s.stacks.forEach(function (x) { x.ref.army[x.type] = x.n; }); });
          res.field = true; res.prov = m1.to; res.from = m1.from;
          res.lines.unshift('Встречный бой в поле между «' + E.provName(st.provs[m1.from]) + '» и «' + E.provName(st.provs[m1.to]) + '».');
          rep.battles.push(res);
        });
      });
    });

    // 4b. Бои в провинциях
    var arrivals = {};
    moving.forEach(function (m) {
      if (!E.armyTotal(m.army)) return;
      arrivals[m.to] = arrivals[m.to] || {};
      var a = arrivals[m.to][m.pid] = arrivals[m.to][m.pid] || {};
      addUnits(a, m.army);
    });
    var order = shuffle(rng, st.provs.map(function (p) { return p.id; }));
    order.forEach(function (id) {
      var prov = st.provs[id];
      var arr = arrivals[id] || {};
      // все присутствующие
      var present = {};
      for (var k in prov.armies) present[k] = Object.assign({}, prov.armies[k]);
      for (var k2 in arr) { present[k2] = present[k2] || {}; addUnits(present[k2], arr[k2]); }
      var pidsHere = Object.keys(present).filter(function (k) { return E.armyTotal(present[k]) > 0; });
      // группы
      var groups = [];
      pidsHere.forEach(function (pid) {
        var g = groups.filter(function (g) { return E.allied(st, g[0], pid); })[0];
        if (g) g.push(pid); else groups.push([pid]);
      });
      var prevOwner = prov.owner;
      if (groups.length > 1) {
        var ownerKey = prov.owner != null ? prov.owner : (present.n ? 'n' : null);
        var mk = function (g, def) { var s = { stacks: [], def: def, g: g }; g.forEach(function (pid) { for (var u in present[pid]) if (present[pid][u] > 0) s.stacks.push({ pid: pid, type: u, n: present[pid][u] }); }); return s; };
        var sides = groups.map(function (g) { return mk(g, ownerKey != null && g.indexOf(ownerKey) >= 0); });
        while (sides.filter(function (s) { return sideTotal(s) > 0; }).length > 1) {
          var live = sides.filter(function (s) { return sideTotal(s) > 0; });
          live.sort(function (a, b) { return sidePower(b) - sidePower(a); });
          var def = live.filter(function (s) { return s.def; })[0];
          var A, B;
          if (def) { A = def; B = live.filter(function (s) { return s !== def; })[0]; }
          else { A = live[0]; B = live[1]; }
          ctx.prov = prov;
          var res = battle(ctx, [A, B]);
          res.prov = id;
          rep.battles.push(res);
        }
        // обновить present
        present = {};
        sides.forEach(function (s) { s.stacks.forEach(function (x) { if (x.n > 0) { present[x.pid] = present[x.pid] || {}; present[x.pid][x.type] = (present[x.pid][x.type] || 0) + x.n; } }); });
      }
      prov.armies = present; cleanArmies(prov);
      // владение
      var holders = Object.keys(prov.armies);
      if (holders.length && holders.indexOf('n') < 0 &&
          !(prov.owner != null && holders.some(function (h) { return E.allied(st, h, prov.owner); }))) {
        holders.sort(function (a, b) { return E.power(prov.armies[b]) - E.power(prov.armies[a]); });
        capture(prov, holders[0], prevOwner);
      }
    });

    function capture(prov, pid, prev) {
      var pl = P(st, pid); if (!pl) return;
      prov.owner = pid;
      var cap = { prov: prov.id, pid: pid, prev: prev, line: null };
      if (prov.walls > 0) pl.stats.wallCapture = true;
      if (fx.crusade[pid]) { prov.burned = 2; }
      var victim = prev != null ? P(st, prev) : null;
      if (prov.t === 'capital' && st.capitals.indexOf(prov.id) >= 0) {
        var origOwner = st.players.filter(function (p) { return p.capital === prov.id; })[0];
        if (victim) {
          victim.glory = Math.max(0, victim.glory - 3);
          rep.groans.push({ pid: victim.pid, big: true });
        }
        if (!origOwner || origOwner.pid !== pid) { pl.glory += 5; pl.stats.caps++; pl.stats.regicide = true; }
        cap.line = '👑 ' + flavor(rng, 'capital', { a: pl.hero.name, v: victim ? victim.hero.name : 'местный бургомистр', prov: E.provName(prov) });
      } else if (prev == null) {
        if (prov.t === 'city' || prov.t === 'monastery' || rng() < 0.15) cap.line = flavor(rng, 'neutral', { a: pl.hero.name, prov: E.provName(prov) });
      }
      rep.captures.push(cap);
      if (cap.line) rep.lines.push(cap.line);
    }

    // 5. Найм и стены — появление
    pendingRecruits.forEach(function (rc) {
      var prov = st.provs[rc.p];
      if (prov.owner !== rc.pid) { rep.lines.push(flavor(rng, 'recruitLost', { p: E.pname(st, rc.pid), prov: E.provName(prov) })); return; }
      prov.armies[rc.pid] = prov.armies[rc.pid] || {};
      prov.armies[rc.pid][rc.u] = (prov.armies[rc.pid][rc.u] || 0) + rc.n;
    });
    pendingWalls.forEach(function (w) { var prov = st.provs[w.p]; if (prov.owner === w.pid) prov.walls = Math.min(CH.MAX_WALLS, prov.walls + 1); });

    // 6. Чума
    var newPlague = [];
    st.provs.forEach(function (prov) {
      if (!(prov.plague > 0)) return;
      for (var k in prov.armies) {
        var a = prov.armies[k], tot = E.armyTotal(a); if (!tot) continue;
        var kill = Math.max(1, Math.round(tot * 0.25)), killed = 0;
        var types = Object.keys(a);
        while (kill > 0 && E.armyTotal(a) > 0) {
          var u = pick(rng, types.filter(function (t) { return a[t] > 0; }));
          a[u]--; kill--; killed++;
        }
        if (k !== 'n') {
          rep.lines.push('☠ ' + flavor(rng, 'plagueDead', { prov: E.provName(prov), n: killed, p: E.pname(st, k) }));
          var pl = P(st, k); if (pl) pl.stats.lost += killed;
          rep.plague.push({ prov: prov.id, pid: k, n: killed });
        }
      }
      cleanArmies(prov);
      st.adj[prov.id].forEach(function (m) { var q = st.provs[m]; if (T[q.t].pass && !q.plague && rng() < 0.1) newPlague.push(m); });
      prov.plague--;
      if (prov.plague === 0) prov.plague = -3; // иммунитет на 2 раунда
    });
    st.provs.forEach(function (p) { if (p.plague < 0) p.plague++; });
    newPlague.forEach(function (m) { if (st.provs[m].plague === 0) { st.provs[m].plague = 3; rep.lines.push('☠ Чума доползла до «' + E.provName(st.provs[m]) + '».'); } });

    // 7. Доход и слава
    st.players.forEach(function (pl) {
      if (!pl.alive) return;
      var inc = E.income(st, pl.pid); pl.gold += inc; rep.income[pl.pid] = inc;
      pl.glory += E.gloryIncome(st, pl.pid);
    });

    // 8. Честные разрывы
    st.breaks.forEach(function (pid) {
      var g = E.allyGroup(st, pid);
      if (g.length > 1) {
        g.filter(function (x) { return x !== pid; }).forEach(function (v) { rep.lines.push('🤝 ' + flavor(rng, 'allianceBroken', { a: E.pname(st, pid), v: E.pname(st, v) })); });
        leaveAlliance(st, pid);
      }
    });
    st.breaks = [];

    // 9. Выбывшие
    st.players.forEach(function (pl) {
      if (!pl.alive) return;
      var provs = E.ownedProvs(st, pl.pid).length, units = E.armyTotal(E.playerUnits(st, pl.pid));
      pl.stats.peakProvs = Math.max(pl.stats.peakProvs, provs);
      if (!provs && !units) {
        pl.alive = false; leaveAlliance(st, pl.pid);
        rep.eliminated.push(pl.pid);
        rep.groans.push({ pid: pl.pid, big: true, elim: true });
        rep.lines.push('💀 ' + flavor(rng, 'elim', { v: pl.hero.name }));
      }
    });

    // 10. Модификаторы прошлого события сгорели
    st.mods = {};

    // 11. Задания
    checkQuests(st, rep, fx);

    // 12. Кулдауны
    st.players.forEach(function (pl) {
      if (pl.cd > 0) pl.cd--;
    });

    // 13. Победа
    var win = checkWin(st);
    if (win) {
      st.winner = win; st.phase = 'over';
      rep.winner = win;
    } else {
      // 14. Событие на следующий раунд
      if (st.round >= 2 && rng() < 0.8) rep.event = rollEvent(st, rng, rep);

  }

      if (!mine) return;
      var front = st.adj[p.id].some(function (m) { var n = st.provs[m]; return T[n.t].pass && !(n.owner != null && E.allied(st, pid, n.owner)); });
      if (front) { dist[p.id] = 0; q.push(p.id); }
    });
    while (q.length) {

      st.adj[x].forEach(function (m) {
        var n = st.provs[m]; if (dist[m] !== undefined || !T[n.t].pass) return;

    }

      var myP = E.power(army);

      var best = null, bs = 0;

        if (myP > hp * 1.35 + 0.5) { var sc = v / (1 + hp * 0.1) + rng(); if (sc > bs) { bs = sc; best = m; } }

        for (var k in army) { var mv = Math.floor(army[k] * (1 - keep)); if (k === 'bombard' || k === 'trebuchet') mv = army[k]; if (keep && (k === 'spear')) mv = Math.floor(army[k] * 0.5); if (mv > 0) u[k] = mv; }

      } else if (dist[p.id] > 0 && !(p.t === 'capital' && threat > 0)) {
        var nb = st.adj[p.id].filter(function (m) { return dist[m] !== undefined && dist[m] < dist[p.id]; });
        if (nb.length) {
          var leave = p.t === 'capital' ? { spear: Math.min(2, army.spear || 0) } : {};
          var u2 = {}; for (var k2 in army) { var n2 = army[k2] - (leave[k2] || 0); if (n2 > 0) u2[k2] = n2; }

        if (pl.hero.active === 'poison') tg.sort(function (a, b) { return hostilePower(st, pid, st.provs[b]) - hostilePower(st, pid, st.provs[a]); });
        if (pl.hero.active === 'bribe' && gold < 6) tg = [];

    // найм
    var sites = st.provs.filter(function (p) { return p.owner === pid && T[p.t].recruit; });

    sites.forEach(function (p) {

        if (c > gold) break;
        gold -= c; counts[ch] = (counts[ch] || 0) + 1;
      }

    function prev() { $('#hb-prev', ov).innerHTML = S.portrait({ id: 'custom', color: d.color }, 4) + '<div style="text-align:center;margin-top:4px">' + S.emblem(d.emblem, d.color, 2) + '</div>'; }

      var c = e.target.closest('[data-col]');

      var em = e.target.closest('[data-em]');
      if (em) { d.emblem = em.dataset.em; ov.querySelectorAll('[data-em]').forEach(function (x) { x.classList.toggle('sel', x === em); }); prev(); A.play('click'); }

      if (!d.title) d.title = 'Самозванец';
      if (!d.capitalName) d.capitalName = 'Твердыня ' + d.name;
      var list = myHeroes(); if (idx >= 0) list[idx] = d; else list.push(d);
      lsSet('chuma_myheroes', JSON.stringify(list.slice(-12)));

    };
    if ($('#hb-del', ov)) $('#hb-del', ov).onclick = function () { var list = myHeroes(); list.splice(idx, 1); lsSet('chuma_myheroes', JSON.stringify(list)); ov.close(); if (App.lobby) renderLobby(); };

  // ---------- ИГРА ----------
  function colors() { var c = {}; App.st.players.forEach(function (p) { c[p.pid] = p.hero.color; }); return c; }
  function onGame(m) {
    var prevRound = App.st ? App.st.round : 0, prevPhase = App.phase;
    App.st = m.st; App.phase = m.phase; App.deadline = Date.now() + m.timeLeft; App.ready = m.ready; App.online = m.online;
    App.nicks = m.nicks; App.you = m.you; App.isHost = m.isHost; App.orderTime = m.orderTime;
    if (App.screen !== 'game') buildGame();
    M.init($('#map'), App.st);
    M.renderBase(App.st, colors());
    if (m.phase === 'orders' && App.draftRound !== App.st.round) {
      App.draft = m.myOrders || E.emptyOrders(); App.draftRound = App.st.round;
      App.sel = null; App.mode = null; App.focusMove = null;
      closeReport();
      if (prevRound) A.play('bell');
      if (App.st.round === 1 && me()) setTimeout(function () { if (App.sel == null) { App.sel = me().capital; renderPanel(); } }, 300);
    }
    if (!App.draft) App.draft = E.emptyOrders();
    if (m.phase === 'report' && App.st.lastReport && App.reportShown !== App.st.lastReport.round) {
      App.reportShown = App.st.lastReport.round; showReport(App.st.lastReport, true);
    }
    if (m.phase === 'over' && !App.endShown) { App.endShown = true; setTimeout(showEnd, App.reportShown ? 300 : 0); }
    (m.offers || []).forEach(function (f) { showAllyOffer(f); });
    pruneDraft();
    renderPanel(); renderTop(); renderFoot();
    var dm = $('#dipmodal'); if (dm) renderDip(dm);
  }

  function buildGame() {
    App.screen = 'game';
    $('#app').innerHTML = '<div id="game"><div id="topbar">' +
      '<span class="dot on" id="tb-conn"></span><span class="tb" id="tb-round"></span><span class="tb" id="tb-timer"></span>' +
      '<span class="tb" id="tb-gold"></span><span class="tb" id="tb-glory"></span><span class="sp"></span>' +
      '<button class="btn wood" id="b-dip">Союзы</button><button class="btn wood" id="b-log">Летопись</button><button class="btn ghost" id="b-menu">☰</button></div>' +
      '<div id="main"><div id="mapwrap"><canvas id="map"></canvas><div id="phasebadge"></div><div id="maphint"></div></div>' +
      '<div id="panel"><div id="panel-body"></div><div id="panel-foot"></div></div></div></div>';
    $('#map').addEventListener('click', function (e) { onMapTap(M.pick(e.clientX, e.clientY)); });
    $('#b-dip').onclick = function () { A.play('click'); showDip(); };
    $('#b-log').onclick = function () { A.play('click'); if (App.st.lastReport) showReport(App.st.lastReport, false); else toast('Летопись пока пуста. Сделай что-нибудь ужасное.'); };
    $('#b-menu').onclick = function () { A.play('click'); showMenu(); };
    $('#panel-body').addEventListener('click', onPanelClick);
    $('#panel-foot').addEventListener('click', onFootClick);
    window.addEventListener('resize', function () { setTimeout(M.fit, 50); });
    keepAwake();
    loop();
  }

  var lastTick = 0;
  function loop() {
    if (App.screen !== 'game') return;
    requestAnimationFrame(loop);
    var now = performance.now();
    if (now - lastTick < 66) return;
    lastTick = now;
    drawMap(now);
    renderTimer();
  }

  function drawMap(t) {
    if (!App.st || !M.ctx) return;
    var o = { t: t, sel: App.sel, moves: [], battles: [], targets: [], flash: [] };
    var st = App.st, mine = me();
    if (App.phase === 'orders' && mine && mine.alive) {
      App.draft.moves.forEach(function (m) { o.moves.push({ from: m.from, to: m.to, color: mine.hero.color, n: E.armyTotal(m.u) }); });
      if (App.mode === 'ability') { o.targets = E.abilityTargets(st, App.you); o.targetColor = '#c77dff'; }
      else if (App.sel != null && E.armyTotal(myArmy(App.sel)) > 0) o.targets = st.adj[App.sel].filter(function (x) { return E.passable(st, x); });
      if (App.draft.ability != null && App.draft.ability >= 0) o.flash.push(App.draft.ability);
    } else if (App.phase === 'report' || (App.phase === 'over' && st.lastReport)) {
      var rep = st.lastReport;
      rep.moves.forEach(function (m) { o.moves.push({ from: m.from, to: m.to, color: colorOf(m.pid), n: m.n }); });
      rep.battles.forEach(function (b) { if (o.battles.indexOf(b.prov) < 0) o.battles.push(b.prov); });
      rep.captures.forEach(function (c) { o.flash.push(c.prov); });
    }
    M.draw(o);
  }

  function renderTop() {
    var st = App.st, pl = me();
    $('#tb-round').innerHTML = 'Раунд ' + st.round + '/' + st.maxRounds;
    if (pl) {
      var left = budget();
      $('#tb-gold').innerHTML = S.img('e_coin', 2) + (App.phase === 'orders' && left !== pl.gold ? left + '<span class="muted">/' + pl.gold + '</span>' : pl.gold);
      $('#tb-glory').innerHTML = S.img('e_star', 2) + pl.glory;
    } else { $('#tb-gold').innerHTML = '<span class="muted">зритель</span>'; $('#tb-glory').innerHTML = ''; }
    var badge = App.phase === 'orders' ? 'Приказы' : App.phase === 'report' ? 'Итоги раунда' : App.phase === 'over' ? 'Конец' : '';
    $('#phasebadge').textContent = badge;
    var hint = '';
    if (App.phase === 'orders' && pl && pl.alive) {
      if (App.mode === 'ability') hint = 'Выбери цель для «' + CH.ACTIVES[pl.hero.active].name + '» (фиолетовые)';
      else if (App.sel != null && E.armyTotal(myArmy(App.sel)) > 0) hint = 'Тапни соседнюю клетку, чтобы отправить туда войска';
      else if (App.st.round === 1 && !App.draft.moves.length) hint = 'Тапни свою столицу (замок с флагом), затем соседнюю клетку';
    } else if (pl && !pl.alive) hint = 'Ты повержен. Можешь смотреть, как другие делают то же самое.';
    $('#maphint').textContent = hint;
    updateConn();
  }
  var lastSec = -1;
  function renderTimer() {
    var el = $('#tb-timer'); if (!el) return;
    if (App.phase === 'over') { el.textContent = ''; return; }
    var s = Math.max(0, Math.ceil((App.deadline - Date.now()) / 1000));
    el.textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
    var hot = App.phase === 'orders' && s <= 10;
    el.classList.toggle('hot', hot);
    if (hot && s !== lastSec && s > 0 && !App.ready[App.you]) A.play('tick');
    lastSec = s;
    var rb = $('#rep-next'); if (rb && App.phase === 'report') rb.textContent = 'Дальше ▶ ' + s;
  }

  // ---------- черновик приказов ----------
  function myArmy(id) { var p = App.st.provs[id]; return (p && App.you && p.armies[App.you]) || {}; }
  function avail(id) {
    var a = Object.assign({}, myArmy(id));
    App.draft.moves.forEach(function (m) { if (m.from === id) for (var k in m.u) a[k] = (a[k] || 0) - m.u[k]; });
    return a;
  }
  function budget() {
    var pl = me(); if (!pl) return 0;
    if (App.phase !== 'orders' || !App.draft) return pl.gold;
    var spent = 0;
    App.draft.recruits.forEach(function (r) { spent += r.n * E.unitCost(App.st, pl, r.u); });
    spent += App.draft.builds.length * E.wallCost(pl);
    if (pl.hero.active === 'bribe' && App.draft.ability != null) spent += CH.ACTIVES.bribe.cost;
    return pl.gold - spent;
  }
  function slotsUsed(id) { return App.draft.recruits.filter(function (r) { return r.p === id; }).reduce(function (s, r) { return s + r.n; }, 0); }
  function pruneDraft() {
    if (!App.draft || !App.st || App.phase !== 'orders') return;
    var st = App.st;
    App.draft.moves = App.draft.moves.filter(function (m) {
      var a = myArmy(m.from);
      for (var k in m.u) { m.u[k] = Math.min(m.u[k], a[k] || 0); if (!m.u[k]) delete m.u[k]; }
      return E.armyTotal(m.u) > 0;
    });
    App.draft.recruits = App.draft.recruits.filter(function (r) { return st.provs[r.p].owner === App.you; });
    App.draft.builds = App.draft.builds.filter(function (b) { return st.provs[b.p].owner === App.you; });
    while (budget() < 0 && App.draft.recruits.length) { var r = App.draft.recruits[App.draft.recruits.length - 1]; r.n--; if (!r.n) App.draft.recruits.pop(); }
    if (budget() < 0) App.draft.builds = [];
  }
  var sendTimer = null;
  function changed() {
    renderPanel(); renderTop();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(function () { App.send({ t: 'orders', round: App.st.round, orders: App.draft }); }, 250);
    if (App.ready[App.you]) { App.ready[App.you] = false; App.send({ t: 'ready', round: App.st.round, ready: false, orders: App.draft }); renderFoot(); }
  }
  function canOrder() { var pl = me(); return App.phase === 'orders' && pl && pl.alive; }

  function onMapTap(id) {
    var st = App.st;
    if (App.mode === 'ability' && canOrder()) {
      if (id >= 0 && E.abilityTargets(st, App.you).indexOf(id) >= 0) { App.draft.ability = id; App.mode = null; A.play('coin'); App.sel = id; changed(); }
      else toast('Сюда нельзя. Выбери фиолетовую провинцию или отмени.', 'error');
      return;
    }
    if (id < 0) { App.sel = null; App.focusMove = null; renderPanel(); renderTop(); return; }
    var sel = App.sel;
    if (canOrder() && sel != null && sel !== id && E.armyTotal(myArmy(sel)) > 0 && st.adj[sel].indexOf(id) >= 0 && E.passable(st, id)) {
      var mv = App.draft.moves.filter(function (m) { return m.from === sel && m.to === id; })[0];
      if (!mv) {
        var a = avail(sel), u = {}; for (var k in a) if (a[k] > 0) u[k] = a[k];
        if (!E.armyTotal(u)) { toast('Все войска отсюда уже в походе. Клонировать крестьян не умеем.'); return; }
        mv = { from: sel, to: id, u: u }; App.draft.moves.push(mv); A.play('march');
      } else A.play('click');
      App.focusMove = mv; changed(); return;
    }
    if (!E.passable(st, id)) { App.sel = null; renderPanel(); renderTop(); toast(T[st.provs[id].t].desc); return; }
    App.sel = id; App.focusMove = null; A.play('click'); renderPanel(); renderTop();
  }

  function armyHtml(a) {
    return '<div class="army">' + Object.keys(a).filter(function (k) { return a[k] > 0; }).map(function (k) {
      return '<span class="u" data-act="uinfo" data-u="' + k + '">' + S.unit(k, 2) + '<b>' + a[k] + '</b></span>';
    }).join('') + '</div>';
  }

  function renderPanel() {
    if (App.screen !== 'game') return;
    var body = $('#panel-body'), st = App.st, pl = me(), h = '';
    if (App.mode === 'ability') {
      var ab = CH.ACTIVES[pl.hero.active];
      h = '<div class="pt">' + esc(ab.name) + '</div><div class="small">' + esc(ab.desc) + '</div><div class="hint">Тапни подсвеченную фиолетовым провинцию.</div><button class="btn ghost small" data-act="abcancel">Отмена</button>';
    } else if (App.sel != null && App.sel >= 0) h = provPanel(App.sel);
    else h = homePanel();
    var sc = body.scrollTop; body.innerHTML = h; body.scrollTop = sc;
  }

  function homePanel() {
    var st = App.st, pl = me();
    if (!pl) return '<div class="pt">Ты зритель</div><div class="small muted">Смотри, как другие делят королевство. Попкорн ещё не изобрели, ешь репу.</div>' + standingsMini();
    var ab = CH.ACTIVES[pl.hero.active], h = '';
    h += '<div class="hero-mini">' + S.portrait(pl.hero, 3) + '<div><div class="pt" style="color:' + pl.hero.color + '">' + esc(pl.hero.name) + '</div><div class="sub">' + esc(pl.hero.title) + '</div></div></div>';
    if (!pl.alive) return h + '<div class="ev"><h3>Ты повержен</h3><div class="small">Голова на пике, имя в летописи. Досмотри, кто победит.</div></div>' + standingsMini();
    h += '<div class="small">Доход: <b>+' + E.income(st, App.you) + '</b> ' + S.img('e_coin', 1) + ' · Слава: <b>+' + E.gloryIncome(st, App.you) + '</b> ' + S.img('e_star', 1) + '/раунд' + (st.mods.famine ? ' <span class="tag judas">неурожай</span>' : '') + (st.mods.mercs ? ' <span class="tag">рыцари −2</span>' : '') + '</div>';
    var abState = pl.cd > 0 ? 'перезарядка: ' + pl.cd : App.draft.ability != null ? '✔ выбрано' + (App.draft.ability >= 0 ? ': ' + esc(E.provName(st.provs[App.draft.ability])) : '') : 'готово';
    h += '<div class="sec">Способность</div><button class="btn ' + (App.draft.ability != null ? 'on' : 'wood') + ' small abil" data-act="ability" ' + (pl.cd > 0 || App.phase !== 'orders' ? 'disabled' : '') + '>' + esc(ab.name) + ' <span class="small">(' + abState + ')</span></button>';
    h += '<div class="small muted">' + esc(ab.desc) + '</div>';
    h += '<div class="sec">Тайные задания (+' + CH.QUEST_REWARD + ' славы)</div>' + pl.quests.map(function (q) { var Q = CH.QUESTS[q.id]; return '<div class="quest ' + (q.done ? 'done' : '') + '">' + (q.done ? '✔ ' : '• ') + '<b>' + esc(Q.name) + '</b>: ' + esc(Q.desc) + '</div>'; }).join('');
    var g = E.allyGroup(st, App.you);
    h += '<div class="sec">Союз</div><div class="small">' + (g.length > 1 ? g.filter(function (x) { return x !== App.you; }).map(nameTag).join(', ') + (st.breaks.indexOf(App.you) >= 0 ? ' <span class="tag">разрыв в конце раунда</span>' : '') : 'Ты один против всех. Как и положено в Средневековье.') + '</div>';
    if (App.draft.betray) h += '<div class="ev small">🗡 Нож в спину союзнику уже заточен. Сработает в начале исполнения.</div>';
    if (App.phase === 'orders') {
      var nm = App.draft.moves.length, nr = App.draft.recruits.reduce(function (s, r) { return s + r.n; }, 0);
      h += '<div class="sec">Приказы</div><div class="small">Походов: ' + nm + ' · Найм: ' + nr + ' · Стены: ' + App.draft.builds.length + ' · Остаток: ' + budget() + ' зол.</div>';
      h += '<div class="hint">Тапни провинцию со своим войском, затем соседнюю — пойдут туда. В городах и столице можно нанимать.</div>';
    }
    return h + standingsMini();
  }
  function standingsMini() {
    var st = App.st, arr = st.players.slice().sort(function (a, b) { return b.glory - a.glory; });
    return '<div class="sec">Слава</div>' + arr.map(function (p) {
      return '<div class="small row" style="gap:4px"><span class="sw" style="background:' + p.hero.color + '"></span>' + esc(p.hero.name) +
        (p.alive ? '' : ' 💀') + (p.judas ? '<span class="tag judas">Иуда</span>' : '') + (E.allied(st, p.pid, App.you) && p.pid !== App.you ? '<span class="tag ally">союз</span>' : '') +
        '<span class="sp"></span><b>' + p.glory + '</b>' + (App.phase === 'orders' && App.ready[p.pid] ? ' ✔' : '') + '</div>';
    }).join('');
  }

  function provPanel(id) {
    var st = App.st, p = st.provs[id], pl = me(), tt = T[p.t], h = '';
    h += '<div class="row"><div class="pt sp">' + esc(E.provName(p)) + '</div><button class="btn tiny ghost" data-act="desel">✕</button></div>';
    h += '<div class="sub">' + tt.name + (p.owner != null ? ' · ' + nameTag(p.owner) : ' · ничья') + (p.walls ? ' · стены ' + p.walls : '') +
      (p.plague > 0 ? ' · <span style="color:#9fd86b">☠ чума ' + p.plague + '</span>' : '') + (p.burned > 0 ? ' · 🔥 сожжена' : '') + '</div>';

      var wb = App.draft.builds.some(function (b) { return b.p === id; });

  function onPanelClick(e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, st = App.st, pl = me(), i = +b.dataset.i, mv = App.draft.moves[i];
    switch (act) {
      case 'desel': App.sel = null; App.focusMove = null; A.play('click'); renderPanel(); renderTop(); return;
      case 'uinfo': var u = U[b.dataset.u]; toast(u.name + ' (' + u.cost + ' зол.): ' + unitStats(b.dataset.u) + '. ' + u.desc); return;
      case 'abcancel': App.mode = null; renderPanel(); renderTop(); return;
      case 'ability':
        if (!canOrder() || pl.cd > 0) return;
        A.play('click');
        if (App.draft.ability != null) { App.draft.ability = null; changed(); return; }
        var ab = CH.ACTIVES[pl.hero.active];
        if (ab.cost && budget() < ab.cost) { toast('Нужно ' + ab.cost + ' золота. Взятки нынче дороги.', 'error'); return; }
        if (ab.target === 'none') { App.draft.ability = -1; changed(); return; }
        if (!E.abilityTargets(st, App.you).length) { toast('Нет подходящих целей. Повезло им.', 'error'); return; }
        App.mode = 'ability'; App.sel = null; renderPanel(); renderTop(); return;
    }
    if (!canOrder()) return;
    switch (act) {
      case 'mv+': var a = avail(mv.from); if ((a[b.dataset.u] || 0) > 0) { mv.u[b.dataset.u] = (mv.u[b.dataset.u] || 0) + 1; A.play('click'); } break;
      case 'mv-': if (mv.u[b.dataset.u] > 0) { mv.u[b.dataset.u]--; if (!mv.u[b.dataset.u]) delete mv.u[b.dataset.u]; A.play('click'); } break;
      case 'mvall': var a2 = avail(mv.from); for (var k in a2) if (a2[k] > 0) mv.u[k] = (mv.u[k] || 0) + a2[k]; break;
      case 'mvhalf': for (var k2 in mv.u) { mv.u[k2] = Math.ceil(mv.u[k2] / 2); } break;
      case 'mvdel': App.draft.moves.splice(i, 1); App.focusMove = null; A.play('click'); break;
      case 'rec+':
        var p = +b.dataset.p, ut = b.dataset.u, c = E.unitCost(st, pl, ut);
        if (slotsUsed(p) >= E.recruitSlots(st, p) || budget() < c) return;
        var r = App.draft.recruits.filter(function (x) { return x.p === p && x.u === ut; })[0];
        if (r) r.n++; else App.draft.recruits.push({ p: p, u: ut, n: 1 });
        A.play('coin'); break;
      case 'rec-':
        var p2 = +b.dataset.p, r2 = App.draft.recruits.filter(function (x) { return x.p === p2 && x.u === b.dataset.u; })[0];
        if (r2) { r2.n--; if (!r2.n) App.draft.recruits.splice(App.draft.recruits.indexOf(r2), 1); }
        A.play('click'); break;
      case 'wall':
        var pw = +b.dataset.p, ex = App.draft.builds.filter(function (x) { return x.p === pw; })[0];
        if (ex) App.draft.builds.splice(App.draft.builds.indexOf(ex), 1);
        else if (budget() >= E.wallCost(pl)) { App.draft.builds.push({ p: pw }); A.play('coin'); }
        else { toast('Не хватает золота на стены. Стройте из крестьян?', 'error'); return; }
        break;
    }
    App.draft.moves = App.draft.moves.filter(function (m) { return E.armyTotal(m.u) > 0; });
    changed();
  }

  // ---------- Итоги раунда ----------
  function closeReport() { var d = $('#report'); if (d) d.remove(); }
  function battleLine(b) {

      ' → ' + (w < 0 ? 'все полегли' : 'победа: ' + b.sides[w].pids.map(function (p) { return p === 'n' ? 'местных' : esc(heroName(p)); }).join('+')) +
      (b.lines.length ? '<div class="small muted">' + b.lines.map(esc).join(' ') + '</div>' : '') + '</div>';

  function showReport(rep, fresh) {
    closeReport();
    var st = App.st, pl = me();
    var playerBattles = rep.battles.filter(function (b) { return b.sides.some(function (s) { return s.pids.some(function (p) { return p !== 'n'; }); }); });
    var myB = playerBattles.filter(function (b) { return b.sides.some(function (s) { return s.pids.indexOf(App.you) >= 0; }); });
    var otherB = playerBattles.filter(function (b) { return myB.indexOf(b) < 0 && b.sides.filter(function (s) { return s.pids.some(function (p) { return p !== 'n'; }); }).length > 1; });
    var neutralB = playerBattles.length - myB.length - otherB.length;
    var h = '<div class="row"><h2 class="sp">Летопись: раунд ' + rep.round + '</h2><button class="btn small ghost" data-rep="close">✕</button></div>';

    if (rep.event) h += '<div class="ev"><h3>' + esc(rep.event.name) + '</h3><div class="small">' + esc(rep.event.text) + '</div>' + (rep.event.detail ? '<div class="small" style="margin-top:3px"><b>' + esc(rep.event.detail) + '</b></div>' : '') + '</div>';
    if (rep.lines.length) h += '<div class="lines">' + rep.lines.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
    if (myB.length) h += '<div class="sec">Твои битвы</div>' + myB.map(battleLine).join('');
    if (otherB.length) h += '<div class="sec">Чужие битвы</div>' + otherB.map(battleLine).join('');
    if (neutralB > 0) h += '<div class="small muted">Ещё ' + neutralB + ' ' + plural(neutralB, 'стычка', 'стычки', 'стычек') + ' с местными. Местные, как обычно, проиграли или очень удивили.</div>';
    if (!rep.lines.length && !playerBattles.length) h += '<div class="small muted">Тихий раунд. Подозрительно тихий.</div>';
    if (rep.winner) h += '<div class="ev"><h3>Игра окончена!</h3></div>';
    h += '<div class="row" style="margin-top:6px">' + (App.phase === 'report' && fresh ? '<button class="btn green sp" id="rep-next" data-rep="next">Дальше ▶</button>' : '<button class="btn ghost sp" data-rep="close">Закрыть</button>') + '</div>';
    var d = document.createElement('div'); d.id = 'report'; d.className = 'drawer frame'; d.innerHTML = h;
    document.body.appendChild(d);
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-rep]'); if (!b) return;
      A.play('click');
      if (b.dataset.rep === 'next') { App.ready[App.you] = true; App.send({ t: 'ready' }); renderFoot(); }
      closeReport();
    });
    if (fresh) playReportSounds(rep);
  }
  function playReportSounds(rep) {
    var t = 0, pl = me();
    function at(d, f) { setTimeout(f, d * 1000); }
    if (rep.battles.length) { at(0, function () { A.play('clash'); }); t = 0.6; }
    if (rep.lines.some(function (l) { return /бомбард/i.test(l) && /взорвал|разорвал/.test(l); })) { at(t, function () { A.play('boom'); }); t += 0.6; }
    if (rep.plague.length || rep.lines.some(function (l) { return l.indexOf('☠') === 0; })) { at(t, function () { A.play('cough'); }); t += 0.7; }
    if (rep.lines.some(function (l) { return l.indexOf('🗡') === 0; })) { at(t, function () { A.play('betray'); }); t += 0.6; }
    var small = rep.groans.filter(function (g) { return !g.big; }).slice(0, 3);
    var big = rep.groans.filter(function (g) { return g.big; }).slice(0, 2);
    small.forEach(function (g) { at(t, function () { A.groan(false); }); t += 0.75; });
    big.forEach(function (g) { at(t, function () { A.groan(true); }); t += 1.6; });
    if (rep.event) at(t, function () { A.play('gong'); });
    if (pl && rep.captures.some(function (c) { return c.pid === App.you && App.st.provs[c.prov].t === 'capital'; })) at(t + 0.3, function () { A.play('fanfare'); });
    if (rep.winner) at(t + 1, function () { A.play(rep.winner.pids.indexOf(App.you) >= 0 ? 'fanfare' : 'sad'); });
  }

    $('#m-mus', ov).onclick = function () { A.setMusic(!A.musicOn); this.textContent = 'Музыка: ' + (A.musicOn ? 'вкл' : 'выкл'); };
    $('#m-rules', ov).onclick = function () { ov.close(); showRules(); };
    $('#m-lore', ov).onclick = function () { ov.close(); showLore(); };
    $('#m-fs', ov).onclick = function () { fs(); ov.close(); };
    $('#m-quit', ov).onclick = function () {
      if (confirm(App.isHost && App.phase !== 'over' ? 'Ты хост! Если выйдешь, игра встанет у всех (продолжить можно будет из меню). Выйти?' : 'Выйти?')) {
        App.leaving = true; location.href = location.pathname + (CH.Net.mode === 'local' ? '?net=local' : '');
      }
    };
  }
  function showRules() {
    var h = '<h2>Правила</h2>' + CH.RULES.map(function (r) { return '<div class="sec">' + esc(r[0]) + '</div><div class="small" style="line-height:1.4">' + r[1] + '</div>'; }).join('');
    h += '<div class="sec">Местность</div><div class="small">' + Object.keys(T).map(function (k) { return '<b>' + T[k].name + '</b>: ' + esc(T[k].desc); }).join('<br>') + '</div>';
    h += '<div class="sec">Отряды</div><table class="utable">' + CH.BASE_UNITS.concat(CH.UNIQUE_UNITS).map(function (u) {
      return '<tr><td>' + S.unit(u, 3) + '</td><td><b>' + esc(U[u].name) + '</b>' + (U[u].unique ? ' <span class="tag">уникальный</span>' : '') + '<br><span class="small">' + U[u].cost + ' зол. · ' + unitStats(u) + '</span><br><span class="small muted">' + esc(U[u].desc) + '</span></td></tr>';
    }).join('') + '</table>';
    modal(h, { cls: 'frame wide' });
  }
  function showLore() {
    var h = '<h2>Летопись Передела</h2>' + CH.LORE.map(function (l) { return '<p class="small" style="line-height:1.5;margin:4px 0">' + esc(l) + '</p>'; }).join('');
    h += CH.HERO_ORDER.map(function (k) { var x = CH.HEROES[k]; return '<div class="row" style="flex-wrap:nowrap;align-items:flex-start;margin-top:10px">' + S.img('p_' + k, 4, x.color, 'portrait') + '<div><b style="color:' + x.color + '">' + esc(x.name) + '</b> <span class="small muted">' + esc(x.title) + '</span><div class="small" style="line-height:1.4">' + esc(x.bio) + '</div></div></div>'; }).join('');
    modal(h, { cls: 'frame wide' });
  }

  // ---------- Конец игры ----------
  var EPITAPHS = ['Посмертно награждён званием «Почти король».', 'Похоронен с почестями. Почести украли на следующий день.',
    'Его имя будут помнить. Минимум до четверга.', 'Ушёл в монастырь. Монастырь был против.', 'Теперь удобряет поля королевства. Урожай благодарен.',
    'Завещал всё кредиторам Дона Антонио. Выбора не было.', 'Летописец написал о нём одну строчку. С ошибкой.', 'Корону примерил. Голова не подошла.'];
  function showEnd() {
    var st = App.st, w = st.winner; if (!w) return;
    var iWon = w.pids.indexOf(App.you) >= 0;
    var names = w.pids.map(function (p) { return heroName(p); }).join(' и ');
    var reason = w.reason === 'capitals' ? names + ' держит все столицы. Королевство принадлежит ' + (w.pids.length > 1 ? 'им' : 'ему') + '. Соболезнуем королевству.' :
      w.reason === 'last' ? 'Остался последний претендент. Остальные удобряют поля.' :
      w.reason === 'glory' ? 'Прошло ' + st.maxRounds + ' раундов. Самый прославленный: ' + w.leaders.map(heroName).join(', ') + '. Слава — это когда о тебе поют. Даже если поют похабное.' +
        (w.pids.length > w.leaders.length ? ' Союзник делит победу — неохотно, как делят добычу.' : '') : 'Все умерли. Чума победила.';
    var rows = st.players.slice().sort(function (a, b) { return b.glory - a.glory; }).map(function (p, i) {
      var won = w.pids.indexOf(p.pid) >= 0;
      return '<tr><td>' + S.portrait(p.hero, 2) + '</td><td><b style="color:' + p.hero.color + '">' + esc(p.hero.name) + '</b> ' + (won ? '👑' : '') + (p.judas ? '<span class="tag judas">Иуда</span>' : '') +
        '<div class="small muted">' + esc(App.nicks[p.pid] || '') + (won ? '' : ' — ' + EPITAPHS[(i + st.seed) % EPITAPHS.length]) + '</div></td>' +
        '<td>' + S.img('e_star', 1) + ' ' + p.glory + '</td><td class="small">земель ' + E.ownedProvs(st, p.pid).length + '<br>убил ' + p.stats.kills + ', потерял ' + p.stats.lost + '</td></tr>';
    }).join('');
    var ov = modal((iWon ? '<div class="winbig">ПОБЕДА!</div>' : '<div class="losebig">' + (me() ? 'ПОРАЖЕНИЕ' : 'КОНЕЦ') + '</div>') +
      '<div class="row" style="justify-content:center;margin:6px 0">' + w.pids.map(function (p) { return S.portrait(E.player(st, p).hero, 5); }).join('') + '</div>' +
      '<p class="small" style="text-align:center">' + esc(reason) + '</p>' +
      '<canvas id="gchart" width="300" height="90" style="width:100%;max-width:420px;height:auto;display:block;margin:6px auto;background:#0004"></canvas>' +
      '<table class="standings" style="width:100%">' + rows + '</table>' +
      '<div class="row" style="justify-content:center;margin-top:8px">' + (App.isHost ? '<button class="btn gold" id="e-again">Ещё катку!</button>' : '<span class="small muted">Хост может начать новую катку.</span>') +
      '<button class="btn ghost" id="e-menu">В главное меню</button></div>', { cls: 'frame wide' });
    drawChart($('#gchart', ov));
    if ($('#e-again', ov)) $('#e-again', ov).onclick = function () { ov.close(); App.send({ t: 'restart' }); };
    $('#e-menu', ov).onclick = function () { App.leaving = true; location.href = location.pathname + (CH.Net.mode === 'local' ? '?net=local' : ''); };
  }
  function drawChart(c) {
    var st = App.st, ctx = c.getContext('2d'), H = st.history; if (!H.length) return;
    var max = 1; H.forEach(function (r) { r.forEach(function (v) { if (v > max) max = v; }); });
    ctx.fillStyle = '#ffffff22'; for (var y = 0; y < 90; y += 18) ctx.fillRect(0, y, 300, 1);
    st.players.forEach(function (p, i) {
      ctx.fillStyle = p.hero.color;
      var prev = null;
      H.forEach(function (r, k) {
        var x = Math.round(4 + k * (292 / Math.max(1, H.length - 1))), yy = Math.round(86 - r[i] / max * 80);
        if (prev) { var steps = Math.max(Math.abs(x - prev[0]), Math.abs(yy - prev[1])); for (var s = 0; s <= steps; s++) ctx.fillRect(Math.round(prev[0] + (x - prev[0]) * s / steps), Math.round(prev[1] + (yy - prev[1]) * s / steps), 2, 2); }
        prev = [x, yy];
      });
    });
  }

  // ---------- старт ----------
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (App.conn && App.conn.poke) App.conn.poke();
      if (A.ctx()) A.init();
      if (App.screen === 'game') keepAwake();
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (App.isHost && App.server && App.server.phase !== 'lobby' && App.server.phase !== 'over' && !App.leaving && !App.server.noSave) { e.preventDefault(); e.returnValue = ''; }
  });
  setInterval(function () {
    if (!App.conn || App.isHost) return;
    if (App.screen === 'game' || App.screen === 'lobby') App.send({ t: 'sync', phase: App.screen === 'lobby' ? 'lobby' : App.phase, round: App.st ? App.st.round : 0 });
  }, 6000);
  document.addEventListener('pointerdown', function () { A.init(); }, { once: true });
  window.addEventListener('DOMContentLoaded', function () {
    $('#rotate-ok').onclick = function () { document.body.classList.add('portrait-ok'); setTimeout(M.fit, 100); };
    App.showTitle();
    if (qs.get('room')) { setTimeout(function () { if (App.nick) App.showJoin(qs.get('room').toUpperCase()); }, 100); }
  });
})();

</script>
</body>
</html>
